- name: Copy Elastic Repo file
  ansible.builtin.template:
    src: elasticsearch.repo
    dest: /etc/yum.repos.d/elasticsearch.repo

- name: Install elasticsearch with specific repo enabled
  ansible.builtin.yum:
    name: elasticsearch
    state: present
    enablerepo: elasticsearch
  become: true

- name: Install elasticsearch
  ansible.builtin.yum:
    name: elasticsearch
    state: installed


