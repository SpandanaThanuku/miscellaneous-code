- name: Set hostname
  ansible.builtin.shell: set-hostname elasticsearch

- name: Copy Elastic Repo file
  ansible.builtin.template:
    src: elasticsearch.repo
    dest: /etc/yum.repos.d/elasticsearch.repo

- name: Install elasticsearch
  ansible.builtin.dnf:
    name: elasticsearch
    state: installed

- name: Start Elasticsearch
  ansible.builtin.systemd_service:
    name: elasticsearch
    state: started
    enabled: yes

- name: Install kibana
  ansible.builtin.dnf:
    name: kibana
    state: installed

- name: Start Kibana
  ansible.builtin.systemd_service:
    name: kibana
    state: started
    enabled: yes

- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: installed

- name: Copy nginx config file
  ansible.builtin.template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf

- name: Start Nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: started



