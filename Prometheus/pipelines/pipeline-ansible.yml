format_version: 10
pipelines:
  prometheus-ansible:
    group: tools
    label_template: ${COUNT}
    materials:
      ansible:
        git: https://github.com/SpandanaThanuku/miscellaneous-code
        shallow_clone: false
        auto_update: true
        branch: main
    stages:
      - apply:
          fetch_materials: true
          keep_artifacts: false
          clean_workspace: false
          jobs:
            apply:
              timeout: 0
              tasks:
                - exec:
                    working_directory: Prometheus
                    command: ansible-playbook
                    arguments: ["-i"
                    "172.31.0.62,",
                    "prometheus.yml"
                    "-e"
                    "ansible-username=centos"
                    "-e"
                    "ansible-password=DevOps321"
                    ]


