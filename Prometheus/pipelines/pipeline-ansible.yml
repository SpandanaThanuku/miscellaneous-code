format_version: 10
pipelines:
  prometheus-ansible:
    group: tools
    label_template: ${COUNT}
    materials:
      ansible:
        git: https://github.com/SpandanaThanuku/miscellaneous-code
        shallow_clone: false
        auto_update: true
        branch: main
    stages:
      - apply:
          fetch_materials: true
          keep_artifacts: false
          clean_workspace: false
          jobs:
            apply:
              timeout: 0
              tasks:
                - exec:
                    command: bash
                    arguments: ["ansible.sh"]


