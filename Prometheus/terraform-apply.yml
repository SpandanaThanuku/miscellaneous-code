format_version: 10
pipelines:
  prometheus:
    group: tools
    label_template: ${COUNT}
    materials:
      ansible:
        git: https://github.com/SpandanaThanuku/miscellaneous-code
        shallow_clone: false
        auto_update: true
        branch: main
    stages:
      - apply:
          fetch_materials: true
          keep_artifacts: false
          clean_workspace: false
          jobs:
            apply:
              timeout: 0
              tasks:
                - exec:
                    command: terraform
                    arguments: ["init"]
                    working_directory: prometheus
                - exec:
                    command: terraform
                    arguments: [ "apply", "-auto-approve" ]
                    working_directory: prometheus
