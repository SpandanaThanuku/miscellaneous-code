format_version: 10
pipelines:
  elasticsearch-ansible:
    group: tools
    label_template: ${COUNT}
    materials:
      ansible:
        git: https://github.com/SpandanaThanuku/miscellaneous-code
        shallow_clone: false
        auto_update: true
        branch: main
        includes:
          - src/**/*.*
    stages:
      - apply:
          fetch_materials: true
          keep_artifacts: false
          clean_workspace: false
          jobs:
            apply:
              approval:
                type: manual
              timeout: 0
              tasks:
                - exec:
                    command: bash
                    arguments: [ "ansible.sh" , "elasticsearch"]


