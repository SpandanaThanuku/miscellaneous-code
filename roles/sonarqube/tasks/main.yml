- name: Set-hostname sonarqube
  ansible.builtin.shell: set-hostname sonarqube

- name: Add Sonarqube user
  ansible.builtin.user:
    name: sonarqube

- name: Download Sonarqube
  ansible.builtin.unarchive:
    src: https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-26.3.0.120487.zip
    dest: /home/sonarqube
    remote_src: yes
    owner: sonarqube
    group: sonarqube

- name: Install Java
  ansible.builtin.dnf:
    name: java-17-openjdk.x86_64
    state: installed

- name: Copy Sonarqube service file
  ansible.builtin.template:
    src: sonarqube.service
    dest: /etc/systemd/system/sonarqube.service

- name: Start Sonarqube Service
  ansible.builtin.systemd_service:
    name: sonarqube
    state: started
    enabled: yes

