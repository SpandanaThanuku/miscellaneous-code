- name: Set Hostname
  ansible.builtin.shell: set-hostname sonarqube

- name: Add SonarQube User
  ansible.builtin.user:
    name: sonarqube

- name: Download SonarQube
  ansible.builtin.unarchive:
    src: https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-26.3.0.120487.zip
    dest: /home/sonarqube
    remote_src: yes
    owner: sonarqube
    group: sonarqube

- name: Install Java
  ansible.builtin.dnf:
    name: https://download.oracle.com/java/26/latest/jdk-26_linux-x64_bin.rpm
    state: installed

- name: Copy SonarQube service file
  ansible.builtin.template:
    src: sonarqube.service
    dest: /etc/systemd/system/sonarqube.service

- name: Start SonarQube Service
  ansible.builtin.systemd_service:
    name: sonarqube
    state: started
    enabled: yes